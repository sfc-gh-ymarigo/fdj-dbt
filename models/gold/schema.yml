version: 2

models:
  - name: fct_activite_quotidienne
    description: "Activité quotidienne en ligne + réseau par produit, canal et Business Unit"
    columns:
      - name: business_unit
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LOTERIE_RESEAU_FRANCE', 'PARIS_JEUX_EN_LIGNE']
  - name: fct_joueur_quotidien
    description: "Joueur x jour : paris, portefeuille, CRM - socle des features ML"
    tests:
      - fdj_unicite_combinee:
          arguments:
            colonnes: ['account_id', 'date_activite']
  - name: dim_joueur_360
    description: "Player 360 des joueurs en ligne"
    columns:
      - name: account_id
        tests: [unique, not_null]
  - name: fct_jeu_responsable_mensuel
    description: "KPI jeu responsable mensuels (règle métier, avant scoring ML)"
